<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Probus Test Studio</title>
  <meta name="description" content="Pick a server, a product, companies, vehicle and RTO - and run Probus motor tests in one click.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322c3ee'/%3E%3Cstop offset='.55' stop-color='%234f6bff'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M22 48V16h13a10 10 0 0 1 0 20h-7' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studio.css">
  <script>
    // Theme before first paint, so there is no flash.
    try {
      const t = localStorage.getItem("studio.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="grid"></div><div class="grain"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#/new" aria-label="Probus Test Studio - new test">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M22 48V16h13a10 10 0 0 1 0 20h-7"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-kicker">Probus</span>
        <span class="brand-name">Test Studio</span>
      </span>
    </a>

    <nav class="nav" aria-label="Main">
      <span class="nav-ink" aria-hidden="true"></span>
      <a href="#/new" data-nav="new">New test</a>
      <a href="#/runs" data-nav="runs">Runs <span class="nav-badge" id="running-badge" hidden>0</span></a>
      <a href="#/guide" data-nav="guide">Guide</a>
    </nav>

    <div class="topbar-right">
      <div class="servers" id="servers" aria-label="Server status"></div>
      <button class="chip-btn" id="who-btn" type="button" aria-label="Change your name"></button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch light or dark"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="modal-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/studio.js"></script>
</body>
</html>
